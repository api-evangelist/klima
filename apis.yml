aid: klima
name: Klima
description: 'Klima was a Berlin-based consumer climate-action company operated by Climate Labs GmbH,
  founded in 2019 by Markus Gilles, Jonas Brandau and Andreas Pursian-Ehrlich. Its mobile app let
  individuals calculate a personal carbon footprint from a lifestyle questionnaire, then offset those
  emissions through a subscription funding Gold Standard and Verified Carbon Standard projects, with
  in-app education and reduction tips layered on top. The company raised roughly USD 16.7M across a
  2020 seed round and a EUR 10M 2022 Series A, backed by HV Capital, Keen Venture Partners, Headline,
  468 Capital and Adjacent. Klima was acquired by Wren on April 30, 2025; klima.com is now a
  single-page wind-down notice and the company exposes no public API, developer portal, SDKs or
  machine-readable artifacts.'
